name: Push reminders (backup manual)

# CRON PRINCIPAL: cron-job.org → https://lestebarbearia.agenciajn.com.br/api/cron/push-reminders
# Este workflow é SOMENTE backup manual (workflow_dispatch) ou caso cron-job.org fique fora.
# O GitHub Actions free tier tem atraso de até 30 min em schedule — não usar como primário.

on:
  workflow_dispatch:

concurrency:
  group: push-reminders
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Chamar endpoint de lembretes
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://lestebarbearia.agenciajn.com.br/api/cron/push-reminders